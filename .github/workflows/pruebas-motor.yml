name: Pruebas del motor STL
on:
  pull_request:
    paths: ["motor/**", ".github/workflows/pruebas-motor.yml"]
  push:
    branches: [main]
    paths: ["motor/**"]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: motor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Muestras (letra M1, letrero frontal y probeta)
        run: |
          python -m letreros_motor A --altura 120 --profundidad 35 -o salida/A.stl
          python -m letreros_motor letrero "LUCY" --estructura frontal -o salida/LUCY
          python -m letreros_motor probeta -o salida/probeta
      - uses: actions/upload-artifact@v4
        with:
          name: stl-muestras
          path: motor/salida/
