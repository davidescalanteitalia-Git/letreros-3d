name: Verificar conexión Coolify
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Comprobar presencia del secreto
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          if [ -z "$COOLIFY_TOKEN" ]; then
            echo "::error::Falta configurar COOLIFY_API_TOKEN en los secretos del repositorio."
            exit 1
          fi
      - name: Consultar API de Coolify (solo lectura)
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          URL="https://coolify.tiendaonline.it/api/v1/projects"
          code=$(curl -sS --connect-timeout 10 --max-time 25 \
            --output /dev/null --write-out '%{http_code}' \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            -H "Accept: application/json" "$URL")
          echo "Respuesta HTTP de Coolify: $code"
          if [ "$code" != "200" ]; then
            echo "::error::No se pudo validar la conexión. Revisa token, permisos, API habilitada y restricción por IP."
            exit 1
          fi
          echo "La API de Coolify responde correctamente. No se han modificado recursos."
